# Dependency automation. Dependabot opens PRs for outdated dependencies so the
# quality gate (not a human's memory) keeps the toolchain current. Grouped to
# avoid a flood of single-package PRs. The npm ecosystem reads the pnpm lockfile.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Wait a week before proposing a freshly published version, so a compromised
    # or broken release is likely yanked before it reaches a PR here.
    cooldown:
      default-days: 7
    # typescript-eslint (via eslint-config-next) does not support TypeScript 7 or
    # ESLint 10 yet; a major bump of either breaks lint and build (see #10). Lift
    # these once typescript-eslint supports them, and move both in one PR.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
    groups:
      npm-dev:
        dependency-type: development
      npm-prod:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
